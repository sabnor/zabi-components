<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover gives env(safe-area-inset-*) a size on a phone with a
    notch or a home indicator. The phone components (AppShell, BottomTabBar,
    Page and the rest) read those insets; without this they are all zero. The
    site keeps its own header, content and footer clear in
    src/routes/+layout.svelte. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("theme");
                var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                var isDark = stored === "dark" || (!stored && prefersDark);
                // The class is all it takes: the theme sets `color-scheme` for it
                // (dark under `.dark`, light otherwise), and the stylesheet is in
                // <head>, so the first paint already has both.
                if (isDark) document.documentElement.classList.add("dark");
            } catch (_) {}
        })();
    </script>
    <!-- Fonts are served from static/fonts (SIL Open Font License, texts alongside)
    rather than Google Fonts: no third-party connection and no render-blocking
    stylesheet request. Body text uses the library's default platform face and
    downloads nothing. Only the marketing headings use a web face, Familjen
    Grotesk, which the pages that set it preload themselves. -->
    <style>
        @font-face {
            font-family: "Familjen Grotesk";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("%sveltekit.assets%/fonts/familjen-grotesk-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Familjen Grotesk";
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("%sveltekit.assets%/fonts/familjen-grotesk-latin-ext.woff2") format("woff2");
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        /* Stand-ins shown until the real files arrive. Arial is scaled to the
        measured advance width of each face, so the swap does not re-wrap text
        or move what sits below it. Where Arial is missing (Android) the
        family is skipped and the system font is used as before. */
        @font-face {
            font-family: "Familjen Grotesk Fallback";
            font-weight: 400 700;
            src: local("Arial Bold"), local("Arial-BoldMT");
            size-adjust: 92%;
            ascent-override: 111%;
            descent-override: 24%;
            line-gap-override: 0%;
        }
    </style>
    %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
